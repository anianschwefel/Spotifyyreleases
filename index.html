<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neue Releases</title>
<style>
  body { background: #0a0a0a; color: #f0f0f0; font-family: sans-serif; padding: 2rem; }
  h1 { color: #1DB954; margin-bottom: 0.5rem; }
  button { background: #1DB954; color: #000; border: none; padding: 10px 24px; border-radius: 50px; font-size: 14px; font-weight: 700; cursor: pointer; margin: 4px; }
  #logout-btn { background: transparent; color: #555; border: 1px solid #333; }
  #debug { background: #111; border: 1px solid #222; border-radius: 8px; padding: 1rem; margin-top: 1rem; font-size: 12px; font-family: monospace; white-space: pre-wrap; line-height: 1.8; max-height: 600px; overflow-y: auto; }
  .ok  { color: #1DB954; }
  .err { color: #ff6b6b; }
  .inf { color: #888; }
</style>
</head>
<body>
<h1>Spotify Debug v2</h1>
<button id="login-btn" onclick="login()">Mit Spotify verbinden</button>
<button id="logout-btn" onclick="logout()" style="display:none">Abmelden</button>
<div id="debug">Warte auf Login…</div>

<script>
  const CLIENT_ID    = 'eaa3c45c11f44c2886360d2148bc4794';
  const REDIRECT_URI = 'https://anianschwefel.github.io/Spotifyyreleases/';
  const SCOPES       = 'user-follow-read';

  const log = (msg, cls='inf') => {
    const d = document.getElementById('debug');
    d.innerHTML += `<span class="${cls}">${msg}</span>\n`;
    d.scrollTop = d.scrollHeight;
  };

  function generateRandom(n) {
    const c = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~';
    const a = new Uint8Array(n);
    crypto.getRandomValues(a);
    return Array.from(a).map(b => c[b % c.length]).join('');
  }
  async function sha256(p) { return crypto.subtle.digest('SHA-256', new TextEncoder().encode(p)); }
  function b64url(buf) { return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }

  async function login() {
    const v = generateRandom(64);
    const c = b64url(await sha256(v));
    localStorage.setItem('pkce_verifier', v);
    window.location.href = 'https://accounts.spotify.com/authorize'
      + '?client_id=' + CLIENT_ID
      + '&response_type=code'
      + '&redirect_uri=' + encodeURIComponent(REDIRECT_URI)
      + '&scope=' + encodeURIComponent(SCOPES)
      + '&code_challenge_method=S256'
      + '&code_challenge=' + c;
  }

  function logout() {
    ['sp_token','sp_refresh_token','sp_expiry','pkce_verifier'].forEach(k => localStorage.removeItem(k));
    location.reload();
  }

  async function fetchToken(code) {
    const res = await fetch('https://accounts.spotify.com/api/token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({
        client_id: CLIENT_ID, grant_type: 'authorization_code',
        code, redirect_uri: REDIRECT_URI,
        code_verifier: localStorage.getItem('pkce_verifier')
      })
    });
    const data = await res.json();
    if (data.access_token) {
      localStorage.setItem('sp_token', data.access_token);
      localStorage.setItem('sp_refresh_token', data.refresh_token || '');
      localStorage.setItem('sp_expiry', Date.now() + data.expires_in * 1000);
      return data.access_token;
    }
    throw new Error(JSON.stringify(data));
  }

  async function getToken() {
    const t = localStorage.getItem('sp_token');
    const e = parseInt(localStorage.getItem('sp_expiry') || 0);
    if (t && Date.now() < e - 60000) return t;
    const refresh = localStorage.getItem('sp_refresh_token');
    if (!refresh) return null;
    const res = await fetch('https://accounts.spotify.com/api/token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({ client_id: CLIENT_ID, grant_type: 'refresh_token', refresh_token: refresh })
    });
    const data = await res.json();
    if (data.access_token) {
      localStorage.setItem('sp_token', data.access_token);
      localStorage.setItem('sp_expiry', Date.now() + data.expires_in * 1000);
      return data.access_token;
    }
    return null;
  }

  async function run() {
    document.getElementById('debug').innerHTML = '';
    const token = await getToken();
    if (!token) { log('❌ Kein Token', 'err'); return; }

    log('🎤 Lade Künstler…');
    let artists = [];
    let next = 'https://api.spotify.com/v1/me/following?type=artist&limit=50';
    while (next) {
      const res = await fetch(next, { headers: { Authorization: 'Bearer ' + token } });
      const data = await res.json();
      if (!data.artists) { log('❌ ' + JSON.stringify(data), 'err'); break; }
      artists.push(...data.artists.items);
      next = data.artists.next;
    }
    log(`✅ ${artists.length} Künstler`, 'ok');

    // Zeige erste 3 Künstler-IDs zur Diagnose
    log('\n🔍 Erste 3 Künstler-IDs:');
    artists.slice(0, 3).forEach(a => log(`  ${a.name}: "${a.id}"`));

    // Bereinige IDs — entferne alles was kein alphanumerisches Zeichen ist
    const cleanId = id => id ? id.trim().replace(/[^a-zA-Z0-9]/g, '') : null;

    const since = new Date();
    since.setDate(since.getDate() - 90);
    const sinceStr = since.toISOString().split('T')[0];
    log(`\n💿 Suche seit ${sinceStr}…\n`);

    let totalFound = 0;
    for (const artist of artists) {
      const id = cleanId(artist.id);
      if (!id || id.length < 10) {
        log(`⚠️ Überspringe ${artist.name} — ungültige ID: "${artist.id}"`, 'err');
        continue;
      }
      try {
        const url = `https://api.spotify.com/v1/artists/${id}/albums?include_groups=album,single&market=DE&limit=10`;
        const res = await fetch(url, { headers: { Authorization: 'Bearer ' + token } });
        const data = await res.json();
        if (res.status !== 200) {
          log(`❌ ${artist.name}: ${res.status} — ${JSON.stringify(data)}`, 'err');
          continue;
        }
        const newOnes = data.items.filter(a => a.release_date >= sinceStr);
        if (newOnes.length > 0) {
          totalFound += newOnes.length;
          newOnes.forEach(a => log(`✅ ${artist.name} — ${a.name} (${a.release_date})`, 'ok'));
        }
      } catch(e) {
        log(`❌ ${artist.name} (${artist.id}): ${e.message}`, 'err');
      }
    }
    log(`\n🎉 Fertig! ${totalFound} neue Releases.`, totalFound > 0 ? 'ok' : 'inf');
  }

  async function init() {
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    if (code) {
      history.replaceState({}, '', REDIRECT_URI);
      try { await fetchToken(code); } catch(e) { log('❌ ' + e.message, 'err'); return; }
    }
    const token = await getToken();
    if (token) {
      document.getElementById('login-btn').style.display = 'none';
      document.getElementById('logout-btn').style.display = 'inline-block';
      run();
    } else {
      log('Bitte mit Spotify verbinden.');
    }
  }

  init();
</script>
</body>
</html>
