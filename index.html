<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neue Releases — Debug</title>
<style>
  body { background: #0a0a0a; color: #f0f0f0; font-family: sans-serif; padding: 2rem; }
  h1 { color: #1DB954; margin-bottom: 0.5rem; }
  button { background: #1DB954; color: #000; border: none; padding: 10px 24px; border-radius: 50px; font-size: 14px; font-weight: 700; cursor: pointer; margin: 4px; }
  #logout-btn { background: transparent; color: #555; border: 1px solid #333; }
  #debug { background: #111; border: 1px solid #222; border-radius: 8px; padding: 1rem; margin-top: 1rem; font-size: 12px; font-family: monospace; white-space: pre-wrap; line-height: 1.8; max-height: 600px; overflow-y: auto; }
  .ok  { color: #1DB954; }
  .err { color: #ff6b6b; }
  .inf { color: #888; }
</style>
</head>
<body>
<h1>Spotify Debug</h1>
<button id="login-btn" onclick="login()">Mit Spotify verbinden</button>
<button id="logout-btn" onclick="logout()" style="display:none">Abmelden</button>
<div id="debug">Warte auf Login…</div>

<script>
  const CLIENT_ID    = 'eaa3c45c11f44c2886360d2148bc4794';
  const REDIRECT_URI = 'https://anianschwefel.github.io/Spotifyyreleases/';
  const SCOPES       = 'user-follow-read';
  const log = (msg, cls='inf') => {
    const d = document.getElementById('debug');
    d.innerHTML += `<span class="${cls}">${msg}</span>\n`;
    d.scrollTop = d.scrollHeight;
  };

  function generateRandom(n) {
    const c = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~';
    const a = new Uint8Array(n);
    crypto.getRandomValues(a);
    return Array.from(a).map(b => c[b % c.length]).join('');
  }
  async function sha256(p) {
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(p));
  }
  function b64url(buf) {
    return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  }

  async function login() {
    const v = generateRandom(64);
    const c = b64url(await sha256(v));
    localStorage.setItem('pkce_verifier', v);
    window.location.href = 'https://accounts.spotify.com/authorize'
      + '?client_id=' + CLIENT_ID
      + '&response_type=code'
      + '&redirect_uri=' + encodeURIComponent(REDIRECT_URI)
      + '&scope=' + encodeURIComponent(SCOPES)
      + '&code_challenge_method=S256'
      + '&code_challenge=' + c;
  }

  function logout() {
    ['sp_token','sp_refresh_token','sp_expiry','pkce_verifier'].forEach(k => localStorage.removeItem(k));
    location.reload();
  }

  async function fetchToken(code) {
    log('🔑 Hole Token von Spotify…');
    const res = await fetch('https://accounts.spotify.com/api/token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({
        client_id: CLIENT_ID,
        grant_type: 'authorization_code',
        code,
        redirect_uri: REDIRECT_URI,
        code_verifier: localStorage.getItem('pkce_verifier')
      })
    });
    const data = await res.json();
    log('Token Antwort: ' + JSON.stringify(data));
    if (data.access_token) {
      localStorage.setItem('sp_token', data.access_token);
      localStorage.setItem('sp_refresh_token', data.refresh_token || '');
      localStorage.setItem('sp_expiry', Date.now() + data.expires_in * 1000);
      log('✅ Token erhalten!', 'ok');
      return data.access_token;
    }
    throw new Error('Kein Token: ' + JSON.stringify(data));
  }

  async function getToken() {
    const t = localStorage.getItem('sp_token');
    const e = parseInt(localStorage.getItem('sp_expiry') || 0);
    if (t && Date.now() < e - 60000) return t;
    log('🔄 Token erneuern…');
    const refresh = localStorage.getItem('sp_refresh_token');
    if (!refresh) return null;
    const res = await fetch('https://accounts.spotify.com/api/token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({ client_id: CLIENT_ID, grant_type: 'refresh_token', refresh_token: refresh })
    });
    const data = await res.json();
    log('Refresh Antwort: ' + JSON.stringify(data));
    if (data.access_token) {
      localStorage.setItem('sp_token', data.access_token);
      localStorage.setItem('sp_expiry', Date.now() + data.expires_in * 1000);
      return data.access_token;
    }
    return null;
  }

  async function api(url, token) {
    const res = await fetch(url, { headers: { Authorization: 'Bearer ' + token } });
    const data = await res.json();
    return { status: res.status, data };
  }

  async function run() {
    document.getElementById('debug').innerHTML = '';
    const token = await getToken();
    if (!token) { log('❌ Kein gültiger Token', 'err'); return; }

    log('✅ Token vorhanden', 'ok');

    // Teste: Wer bin ich?
    log('\n👤 Teste /me …');
    const me = await api('https://api.spotify.com/v1/me', token);
    log('Status: ' + me.status);
    log('Nutzer: ' + JSON.stringify({ id: me.data.id, name: me.data.display_name, email: me.data.email }), me.status === 200 ? 'ok' : 'err');

    // Teste: Gefolgten Künstler
    log('\n🎤 Teste /me/following …');
    const following = await api('https://api.spotify.com/v1/me/following?type=artist&limit=5', token);
    log('Status: ' + following.status);
    if (following.status === 200) {
      const total = following.data.artists?.total;
      const names = following.data.artists?.items?.map(a => a.name).join(', ');
      log(`Gesamt: ${total} Künstler`, 'ok');
      log(`Erste 5: ${names}`, 'ok');

      // Teste einen Künstler
      const first = following.data.artists?.items?.[0];
      if (first) {
        log(`\n💿 Teste Releases für "${first.name}" …`);
        const albums = await api(`https://api.spotify.com/v1/artists/${first.id}/albums?include_groups=album,single&market=DE&limit=5`, token);
        log('Status: ' + albums.status);
        if (albums.status === 200) {
          log('Releases: ' + albums.data.items.map(a => `${a.name} (${a.release_date})`).join(', '), 'ok');
        } else {
          log('Fehler: ' + JSON.stringify(albums.data), 'err');
        }
      }
    } else {
      log('Fehler: ' + JSON.stringify(following.data), 'err');
    }
  }

  async function init() {
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    if (code) {
      history.replaceState({}, '', REDIRECT_URI);
      try { await fetchToken(code); } catch(e) { log('❌ ' + e.message, 'err'); return; }
    }
    const token = await getToken();
    if (token) {
      document.getElementById('login-btn').style.display = 'none';
      document.getElementById('logout-btn').style.display = 'inline-block';
      run();
    } else {
      log('Bitte mit Spotify verbinden.');
    }
  }

  init();
</script>
</body>
</html>
